<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B8B8B"/>
      <stop offset="50%" style="stop-color:#6B6B6B"/>
      <stop offset="100%" style="stop-color:#4B4B4B"/>
    </linearGradient>
    <linearGradient id="def" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5"/>
      <stop offset="100%" style="stop-color:#1E88E5"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ff8c42"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg2)"/>
  <!-- Badge -->
  <rect x="20" y="15" width="70" height="32" rx="4" fill="#FFCD11"/>
  <text x="55" y="37" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#111" text-anchor="middle">SCR</text>
  <text x="100" y="37" font-family="Arial,sans-serif" font-weight="bold" font-size="15" fill="#fff">Selective Catalytic Reduction</text>
  <!-- Inlet pipe -->
  <rect x="40" y="165" width="110" height="55" rx="8" fill="url(#metal2)" filter="url(#shadow2)"/>
  <rect x="50" y="175" width="90" height="35" rx="4" fill="#555"/>
  <!-- Main SCR body -->
  <rect x="150" y="130" width="300" height="125" rx="16" fill="url(#metal2)" filter="url(#shadow2)" stroke="#777" stroke-width="2"/>
  <!-- Catalyst honeycomb -->
  <g opacity="0.3">
    <line x1="190" y1="140" x2="190" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="220" y1="140" x2="220" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="250" y1="140" x2="250" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="280" y1="140" x2="280" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="310" y1="140" x2="310" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="340" y1="140" x2="340" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="370" y1="140" x2="370" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="400" y1="140" x2="400" y2="245" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="165" x2="440" y2="165" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="192" x2="440" y2="192" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="220" x2="440" y2="220" stroke="#999" stroke-width="1"/>
  </g>
  <!-- DEF injector -->
  <rect x="270" y="75" width="60" height="55" rx="6" fill="url(#def)" filter="url(#shadow2)" stroke="#1976D2" stroke-width="1.5"/>
  <text x="300" y="100" font-family="Arial,sans-serif" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">DEF</text>
  <text x="300" y="115" font-family="Arial,sans-serif" font-size="9" fill="#E3F2FD" text-anchor="middle">Injector</text>
  <!-- DEF spray -->
  <line x1="290" y1="130" x2="280" y2="150" stroke="#42A5F5" stroke-width="2" opacity="0.7"/>
  <line x1="300" y1="130" x2="300" y2="155" stroke="#42A5F5" stroke-width="2" opacity="0.8"/>
  <line x1="310" y1="130" x2="320" y2="150" stroke="#42A5F5" stroke-width="2" opacity="0.7"/>
  <circle cx="280" cy="152" r="2" fill="#42A5F5" opacity="0.6"/>
  <circle cx="300" cy="157" r="2" fill="#42A5F5" opacity="0.7"/>
  <circle cx="320" cy="152" r="2" fill="#42A5F5" opacity="0.6"/>
  <!-- Outlet pipe -->
  <rect x="450" y="165" width="110" height="55" rx="8" fill="url(#metal2)" filter="url(#shadow2)"/>
  <rect x="460" y="175" width="90" height="35" rx="4" fill="#555"/>
  <!-- Flow arrows -->
  <polygon points="65,170 95,192 65,215" fill="url(#glow2)" opacity="0.9"/>
  <polygon points="475,170 505,192 475,215" fill="#4CAF50" opacity="0.9"/>
  <!-- Labels -->
  <text x="95" y="245" font-family="Arial,sans-serif" font-size="11" fill="#aaa">NOx In</text>
  <text x="470" y="245" font-family="Arial,sans-serif" font-size="11" fill="#aaa">N₂ + H₂O</text>
  <!-- Description -->
  <text x="300" y="305" font-family="Arial,sans-serif" font-size="12" fill="#ccc" text-anchor="middle">Uses urea (DEF) to convert harmful NOx</text>
  <text x="300" y="325" font-family="Arial,sans-serif" font-size="11" fill="#999" text-anchor="middle">into nitrogen and water for emission compliance</text>
</svg>
